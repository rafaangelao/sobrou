<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0F241B">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icones/favicon.png">
<link rel="apple-touch-icon" href="/icones/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sobrou">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sobrou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..700,0..100,0..1;1,9..144,400..700,0..100,0..1&family=Figtree:wght@400;500;600;700&display=swap">

<style>
:root{
  /* Cédula: verde de nota, creme de papel-moeda, dourado só no que importa */
  color-scheme: dark;
  --papel:#0F241B;
  --superficie:#15301F;
  --superficie-2:#1B3A2C;
  --linha:#264636;
  --linha-forte:#37604C;
  --tinta:#F1EADA;
  --tinta-2:#CBC1A8;
  --tinta-3:#93A596;
  --marca:#D8B45A;
  --marca-suave:#2F3B24;
  --marca-tinta:#EBCB7A;
  --sobre-marca:#13261B;
  --bom:#8FD4A4;
  --bom-suave:#1D4231;
  --alerta:#EDA15F;
  --alerta-suave:#3B3020;
  --grave:#EC8471;
  --grave-suave:#45271F;
  --c1:#6FB4B8; --c2:#D9774F; --c3:#8CC48A; --c4:#E2B451; --c5:#C98BB0;
  --c6:#5E9C76; --c7:#A3A2D8; --c8:#D86B5E; --c9:#7DC4A0; --c0:#8E9A8F;
  --sombra:inset 0 1px 0 rgba(241,234,218,.04), 0 14px 30px -20px rgba(0,0,0,.75);
  --raio:16px;
  --mola:cubic-bezier(.2,.85,.25,1);
  --fonte-display:"Fraunces",ui-serif,Georgia,"Times New Roman",serif;
  --fonte-corpo:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --fonte-num:"Fraunces",ui-serif,Georgia,serif;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--papel);
  color:var(--tinta);
  font-family:var(--fonte-corpo);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--fonte-display);margin:0;text-wrap:balance;letter-spacing:-.015em}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--fonte-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.app{max-width:1180px;margin:0 auto;padding:0 18px 120px}

/* ---------- topo ---------- */
.topo{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--papel) 88%, transparent);
  backdrop-filter:blur(12px);
  margin:0 -18px;padding:14px 18px 0;
  border-bottom:1px solid var(--linha);
}
.topo-linha{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.marca{display:flex;align-items:center;gap:10px;margin-right:auto}
.selo{
  width:34px;height:34px;border-radius:10px;flex:none;
  background:var(--marca);color:#fff;
  display:grid;place-items:center;
  font-family:var(--fonte-display);font-weight:800;font-size:17px;
}
.marca h1{font-size:19px;font-weight:700;line-height:1.15}
.marca p{margin:0;font-size:11.5px;color:var(--tinta-3);letter-spacing:.06em;text-transform:uppercase;font-weight:500}

.periodo{display:flex;align-items:center;gap:0;background:var(--superficie);border:1px solid var(--linha);border-radius:10px;overflow:hidden}
.periodo button{
  background:none;border:0;padding:8px 11px;cursor:pointer;color:var(--tinta-2);
  display:grid;place-items:center;
}
.periodo button:hover{background:var(--superficie-2);color:var(--tinta)}
.periodo select{
  background:none;border:0;padding:8px 4px;cursor:pointer;font-weight:600;font-size:14px;
  min-width:130px;text-align:center;text-align-last:center;
}
.periodo select:focus-visible{outline:2px solid var(--marca);outline-offset:-2px}

.estado{
  display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
  padding:7px 12px;border-radius:999px;border:1px solid var(--linha);
  background:var(--superficie);color:var(--tinta-2);white-space:nowrap;
}
.estado .ponto{width:7px;height:7px;border-radius:50%;background:var(--bom);flex:none}
.estado[data-s="sujo"]{border-color:var(--alerta);background:var(--alerta-suave);color:var(--alerta);cursor:pointer}
.estado[data-s="sujo"] .ponto{background:var(--alerta);animation:pulsa 1.6s infinite}
.estado[data-s="salvando"] .ponto{background:var(--marca);animation:pulsa .9s infinite}
@keyframes pulsa{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

@media(max-width:440px){
  .marca h1{font-size:17px}
  .marca p{font-size:10px}
  .selo{width:30px;height:30px;font-size:15px}
  .periodo select{min-width:104px;font-size:13px}
  .periodo button{padding:8px 9px}
  .estado{padding:6px 10px;font-size:11.5px}
  .abas button{padding:10px 11px;font-size:13.5px}
  .cartao{padding:15px}
}

.abas{display:flex;gap:2px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.abas button{
  background:none;border:0;border-bottom:2px solid transparent;
  padding:10px 14px;cursor:pointer;white-space:nowrap;
  font-weight:600;font-size:14px;color:var(--tinta-3);
}
.abas button:hover{color:var(--tinta)}
.abas button[aria-selected="true"]{color:var(--marca-tinta);border-bottom-color:var(--marca)}
.abas .cont{font-family:var(--fonte-num);font-size:11px;opacity:.7;margin-left:5px}

/* ---------- blocos ---------- */
main{padding-top:22px;display:flex;flex-direction:column;gap:18px}
.cartao{
  background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio);
  padding:18px;box-shadow:var(--sombra);
}
.cartao > h2{font-size:15px;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cartao > h2 small{font-family:var(--fonte-corpo);font-weight:500;font-size:12.5px;color:var(--tinta-3);letter-spacing:0}
.cartao > h2 + p.sub{margin:4px 0 0;font-size:13px;color:var(--tinta-3);max-width:62ch}

.grade{display:grid;gap:18px}
@media(min-width:860px){ .grade-2{grid-template-columns:1.25fr 1fr} }

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{
  background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio);
  padding:14px 15px;box-shadow:var(--sombra);position:relative;overflow:hidden;min-width:0;
}
.kpi .rot{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--tinta-3)}
.kpi .val{
  font-family:var(--fonte-num);font-weight:600;letter-spacing:-.05em;margin-top:6px;line-height:1.1;
  font-size:clamp(18px,4.7vw,25px);
}
@media(min-width:700px){ .kpi .val{font-size:25px} }
.kpi .pe{font-size:12px;color:var(--tinta-3);margin-top:3px}
.kpi[data-t="bom"] .val{color:var(--bom)}
.kpi[data-t="grave"] .val{color:var(--grave)}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--faixa,transparent)}

/* ---------- barras de categoria ---------- */
.cats{display:flex;flex-direction:column;gap:13px;margin-top:16px}
.cat-topo{display:flex;align-items:baseline;gap:8px;font-size:13.5px}
.cat-nome{font-weight:600;display:flex;align-items:center;gap:7px;min-width:0}
.cat-nome span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pastilha{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.cat-val{margin-left:auto;font-family:var(--fonte-num);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.cat-val em{font-style:normal;color:var(--tinta-3);font-size:12px;margin-left:6px}
.trilho{height:9px;border-radius:5px;background:var(--superficie-2);margin-top:6px;overflow:hidden;border:1px solid var(--linha)}
.barra{height:100%;border-radius:4px;background:var(--c);width:var(--w);min-width:3px;transition:width .45s cubic-bezier(.2,.8,.2,1)}

/* ---------- gráfico de colunas ---------- */
.colunas{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;align-items:end;gap:2px;height:130px;margin-top:18px}
.col{position:relative;height:100%;display:flex;align-items:flex-end;cursor:default;border-radius:3px}
.col:hover{background:var(--superficie-2)}
.col i{display:block;width:100%;background:var(--marca);border-radius:3px 3px 0 0;min-height:2px;height:var(--h);opacity:.85}
.col[data-hoje] i{background:var(--c2);opacity:1}
.eixo{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;margin-top:7px;font-family:var(--fonte-num);font-size:10px;color:var(--tinta-3);text-align:center}
.eixo span{overflow:hidden}

/* ---------- lista de lançamentos ---------- */
.lista{display:flex;flex-direction:column;margin-top:8px}
.dia-rot{
  display:flex;align-items:baseline;gap:10px;padding:14px 0 7px;
  font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-3);
  border-bottom:1px solid var(--linha);
}
.dia-rot b{margin-left:auto;font-family:var(--fonte-num);font-weight:500;letter-spacing:0;text-transform:none;font-size:13px;color:var(--tinta-2)}
.item{
  display:flex;align-items:center;gap:11px;padding:10px 8px;margin:0 -8px;
  border-radius:9px;border-bottom:1px solid var(--linha);
}
.item:hover{background:var(--superficie-2)}
.item:last-child{border-bottom:0}
.item .pastilha{width:8px;height:26px;border-radius:3px}
.item-txt{min-width:0;flex:1}
.item-txt b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-txt small{color:var(--tinta-3);font-size:12px}
.item .valor{font-family:var(--fonte-num);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.item .valor.mais{color:var(--bom)}
.acoes{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.item:hover .acoes,.item:focus-within .acoes{opacity:1}
@media(hover:none){.acoes{opacity:1}}
.icone{
  background:none;border:0;padding:6px;border-radius:7px;cursor:pointer;color:var(--tinta-3);
  display:grid;place-items:center;
}
.icone:hover{background:var(--linha);color:var(--tinta)}
.icone.perigo:hover{background:var(--grave-suave);color:var(--grave)}

/* ---------- insights ---------- */
.insights{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:4px}
.insight{
  border:1px solid var(--linha);border-radius:var(--raio);padding:15px;
  background:var(--superficie);display:flex;flex-direction:column;gap:7px;
}
.insight[data-n="alto"]{border-color:color-mix(in srgb,var(--grave) 45%,var(--linha));background:linear-gradient(var(--grave-suave),var(--superficie) 62%)}
.insight[data-n="medio"]{border-color:color-mix(in srgb,var(--alerta) 42%,var(--linha));background:linear-gradient(var(--alerta-suave),var(--superficie) 62%)}
.insight[data-n="bom"]{border-color:color-mix(in srgb,var(--bom) 42%,var(--linha));background:linear-gradient(var(--bom-suave),var(--superficie) 62%)}
.chip{
  align-self:flex-start;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:5px;background:var(--linha);color:var(--tinta-2);
}
.insight[data-n="alto"] .chip{background:var(--grave);color:#fff}
.insight[data-n="medio"] .chip{background:var(--alerta);color:#fff}
.insight[data-n="bom"] .chip{background:var(--bom);color:#fff}
.insight h3{font-size:15px;font-weight:700;line-height:1.3}
.insight p{margin:0;font-size:13.5px;color:var(--tinta-2);line-height:1.55}
.insight .ganho{
  margin-top:auto;padding-top:10px;border-top:1px dashed var(--linha-forte);
  font-family:var(--fonte-num);font-size:13px;font-weight:600;color:var(--bom);
}

/* ---------- simulador ---------- */
.sim-linha{display:grid;grid-template-columns:1fr;gap:8px;padding:14px 0;border-bottom:1px solid var(--linha)}
.sim-linha:last-of-type{border-bottom:0}
.sim-topo{display:flex;align-items:center;gap:9px;font-size:13.5px}
.sim-topo b{font-weight:600}
.sim-topo .atual{margin-left:auto;font-family:var(--fonte-num);color:var(--tinta-3);font-size:12.5px}
.sim-ctrl{display:flex;align-items:center;gap:12px}
input[type=range]{flex:1;accent-color:var(--marca);height:22px}
.sim-res{font-family:var(--fonte-num);font-weight:600;font-size:13.5px;min-width:104px;text-align:right;color:var(--bom)}
.sim-total{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-top:16px;padding:15px;
  border-radius:11px;background:var(--marca-suave);border:1px solid color-mix(in srgb,var(--marca) 30%,transparent);
}
.sim-total .g{font-family:var(--fonte-num);font-size:24px;font-weight:600;color:var(--marca-tinta);letter-spacing:-.04em}
.sim-total .r{font-size:13px;color:var(--tinta-2)}

/* ---------- metas ---------- */
.meta-linha{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--linha)}
.meta-linha:last-child{border-bottom:0}
.meta-in{display:flex;align-items:center;gap:6px;background:var(--superficie-2);border:1px solid var(--linha);border-radius:9px;padding:5px 10px}
.meta-in span{font-size:12px;color:var(--tinta-3)}
.meta-in input{width:76px;background:none;border:0;font-family:var(--fonte-num);font-weight:500;text-align:right;padding:2px 0}
.meta-in input:focus{outline:0}
.meta-in:focus-within{border-color:var(--marca)}

/* ---------- botões / formulário ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  padding:9px 15px;border-radius:10px;border:1px solid var(--linha-forte);
  background:var(--superficie);cursor:pointer;font-weight:600;font-size:13.5px;
  transition:background .15s,border-color .15s;
}
.btn:hover{background:var(--superficie-2)}
.btn-forte{background:var(--marca);border-color:var(--marca);color:#fff}
.btn-forte:hover{background:var(--marca-tinta);border-color:var(--marca-tinta)}
.btn-txt{border-color:transparent;background:none;color:var(--tinta-2)}
.btn-txt:hover{background:var(--superficie-2)}
:focus-visible{outline:2px solid var(--marca);outline-offset:2px;border-radius:4px}

.fab{
  position:fixed;right:20px;bottom:20px;z-index:50;
  width:56px;height:56px;border-radius:18px;border:0;cursor:pointer;
  background:var(--marca);color:#fff;display:grid;place-items:center;
  box-shadow:0 6px 20px -4px color-mix(in srgb,var(--marca) 55%,transparent);
}
.fab:hover{background:var(--marca-tinta)}

.veu{
  position:fixed;inset:0;z-index:60;background:rgba(12,10,24,.45);
  display:grid;place-items:end center;padding:16px;
}
@media(min-width:640px){.veu{place-items:center}}
.folha{
  background:var(--superficie);border:1px solid var(--linha);border-radius:18px;
  width:100%;max-width:430px;padding:20px;box-shadow:0 24px 60px -12px rgba(0,0,0,.4);
  max-height:88vh;overflow-y:auto;
}
.folha h2{font-size:18px;font-weight:700;margin-bottom:14px}
.campo{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.campo label{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--tinta-3)}
.campo input,.campo select{
  padding:10px 12px;border-radius:10px;border:1px solid var(--linha-forte);
  background:var(--superficie-2);width:100%;
}
.campo input:focus,.campo select:focus{outline:0;border-color:var(--marca);background:var(--superficie)}
.campo .dica{font-size:11.5px;color:var(--tinta-3)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.seletor-tipo{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--superficie-2);padding:4px;border-radius:11px;margin-bottom:15px}
.seletor-tipo button{
  border:0;background:none;padding:9px;border-radius:8px;cursor:pointer;
  font-weight:600;font-size:13.5px;color:var(--tinta-3);
}
.seletor-tipo button[aria-pressed="true"]{background:var(--superficie);color:var(--tinta);box-shadow:var(--sombra)}
.folha-pe{display:flex;gap:9px;margin-top:18px}
.folha-pe .btn{flex:1}

/* ---------- tabela ---------- */
.rolar{overflow-x:auto;margin-top:14px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{
  text-align:left;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--tinta-3);padding:0 12px 8px 0;border-bottom:1px solid var(--linha-forte);white-space:nowrap;
}
td{padding:9px 12px 9px 0;border-bottom:1px solid var(--linha);white-space:nowrap}
td.n{font-family:var(--fonte-num);font-variant-numeric:tabular-nums;text-align:right;padding-right:0}
th.n{text-align:right;padding-right:0}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:2px solid var(--linha-forte);border-bottom:0;padding-top:11px}

.vazio{text-align:center;padding:44px 20px;color:var(--tinta-3)}
.vazio h3{font-size:16px;color:var(--tinta);margin-bottom:6px}
.vazio p{margin:0 auto;max-width:40ch;font-size:13.5px}

.brisa{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.filtro{
  padding:6px 12px;border-radius:999px;border:1px solid var(--linha-forte);background:var(--superficie);
  font-size:12.5px;font-weight:600;cursor:pointer;color:var(--tinta-2);
}
.filtro[aria-pressed="true"]{background:var(--marca);border-color:var(--marca);color:#fff}

/* ---------- importar extrato ---------- */
.solta{
  border:2px dashed var(--linha-forte);border-radius:var(--raio);
  padding:26px 18px;text-align:center;background:var(--superficie-2);margin-top:16px;
  transition:border-color .15s,background .15s;
}
.solta.sobre{border-color:var(--marca);background:var(--marca-suave)}
.solta b{font-size:14.5px}
.solta p{margin:5px 0 0;font-size:12.5px;color:var(--tinta-3);font-family:var(--fonte-num)}
textarea.extrato{
  width:100%;min-height:150px;margin-top:12px;padding:12px;
  border-radius:11px;border:1px solid var(--linha-forte);background:var(--superficie-2);
  font-family:var(--fonte-num);font-size:12.5px;line-height:1.65;resize:vertical;
}
textarea.extrato:focus{outline:0;border-color:var(--marca);background:var(--superficie)}
.rev-grupo{margin-top:20px}
.rev-cab{
  display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;padding:9px 0;
  border-bottom:1px solid var(--linha-forte);
}
.rev-cab .tag{
  font-family:var(--fonte-num);font-size:11px;font-weight:600;padding:2px 8px;
  border-radius:5px;background:var(--linha);color:var(--tinta-2);
}
.rev-cab[data-p] .tag{background:var(--grave);color:#fff}
.rev{
  display:grid;grid-template-columns:auto 1fr auto;gap:9px 11px;align-items:center;
  padding:11px 10px;margin:0 -10px;border-radius:10px;border-bottom:1px solid var(--linha);
}
.rev:hover{background:var(--superficie-2)}
.rev.pendente{background:var(--grave-suave)}
.rev.fora{opacity:.4}
.rev input[type=checkbox]{width:17px;height:17px;accent-color:var(--marca)}
.rev-txt{min-width:0}
.rev-txt b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rev-txt small{font-size:11.5px;color:var(--tinta-3)}
.rev-val{font-family:var(--fonte-num);font-variant-numeric:tabular-nums;font-weight:500;font-size:13.5px;white-space:nowrap}
.rev-val.mais{color:var(--bom)}
.rev-cat{grid-column:2/4;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.rev-cat select{
  flex:1;min-width:150px;padding:7px 9px;border-radius:9px;
  border:1px solid var(--linha-forte);background:var(--superficie);font-size:13px;
}
.rev-cat select[data-vazio="1"]{border-color:var(--grave);color:var(--grave);font-weight:600}
.rev-cat select:focus{outline:0;border-color:var(--marca)}
.rev-cat .mini{font-size:11.5px;color:var(--tinta-3)}
.barra-acao{
  position:sticky;bottom:0;z-index:20;margin:20px -18px -18px;padding:14px 18px;
  background:var(--superficie);border-top:1px solid var(--linha-forte);
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  border-radius:0 0 var(--raio) var(--raio);
}
.barra-acao .conta{font-size:13px;color:var(--tinta-2);margin-right:auto}
.btn[disabled]{opacity:.45;cursor:not-allowed}
summary::-webkit-details-marker{display:none}

#torrada{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);
  z-index:90;background:var(--tinta);color:var(--papel);
  padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;
  transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 10px 30px -8px rgba(0,0,0,.5);
  max-width:calc(100vw - 32px);text-align:center;
}
#torrada.vem{transform:translateX(-50%) translateY(0)}
.meses{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.mes h3{font-size:14px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.mes h3 span{font-family:var(--fonte-num);font-weight:600}
.mes .pe-mes{font-size:12px;color:var(--tinta-3);margin:2px 0 6px}
.fx{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:9px 0;border-bottom:1px solid var(--linha);align-items:center}
.fx:last-child{border-bottom:0}
.fx b{font-size:13.5px;font-weight:600}
.fx small{font-size:11.5px;color:var(--tinta-3)}
.fx .valor{font-family:var(--fonte-num);font-variant-numeric:tabular-nums;text-align:right;font-size:13.5px}
.fx .btn{padding:5px 10px;font-size:12px;margin-top:4px}
.selo-sit{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;margin-left:6px;white-space:nowrap}
.selo-sit[data-s="pago"]{background:var(--bom-suave);color:var(--bom)}
.selo-sit[data-s="a-pagar"]{background:var(--marca-suave);color:var(--marca-tinta)}
.selo-sit[data-s="atrasado"]{background:var(--grave-suave);color:var(--grave)}
.aviso{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-radius:12px;background:var(--alerta-suave);color:var(--alerta);font-size:13.5px;font-weight:600}
.aviso[data-t="grave"]{background:var(--grave-suave);color:var(--grave)}
.rapido{display:flex;gap:8px;margin-top:12px}
.rapido input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--linha-forte);background:var(--superficie);font:inherit;font-size:14.5px;color:var(--tinta)}
.rapido input:focus{outline:0;border-color:var(--marca)}
.rapido-previa{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px;font-size:12.5px;color:var(--tinta-2)}
.rapido-previa:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--superficie-2);border:1px solid var(--linha);font:inherit;font-weight:600;color:var(--tinta)}
.chip.mais{color:var(--bom)}
button.chip{cursor:pointer}
.rapido-previa select{padding:3px 8px;border-radius:999px;border:1px solid var(--linha-forte);background:var(--superficie);font:inherit;font-size:12.5px}
.rapido-previa select[data-vazio="1"]{border-color:var(--grave);color:var(--grave);font-weight:600}
.rapido-previa .falta{color:var(--grave);font-weight:600}
.estado[data-s="offline"]{border-color:var(--alerta);background:var(--alerta-suave);color:var(--alerta);cursor:pointer}
.estado[data-s="offline"] .ponto{background:var(--alerta)}
.entrar{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:18px;background:rgba(26,24,38,.55);backdrop-filter:blur(3px)}
.entrar .folha{max-width:400px;width:100%}
/* ======================= CÉDULA: acabamento ======================= */
body{
  background:
    radial-gradient(1100px 520px at 50% -220px, #1A3D2D 0%, transparent 70%),
    var(--papel);
  background-attachment:fixed;
  font-size:15px;
}
.num,.kpi .val,.cat-val,.item .valor,.fx .valor,.rev-val,td.n,.sim-res,.sim-total .g,.mes h3 span{
  font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em;
}
h1,h2,h3{font-weight:600;letter-spacing:-.01em;font-variation-settings:"SOFT" 30,"WONK" 0}

/* topo */
.topo{background:color-mix(in srgb, var(--papel) 82%, transparent);border-bottom-color:color-mix(in srgb,var(--marca) 22%,var(--linha))}
.selo{border-radius:50%;background:none;border:1.5px solid var(--marca);color:var(--marca);font-family:var(--fonte-display);font-weight:600;font-size:16px;box-shadow:inset 0 0 0 3px var(--papel),inset 0 0 0 4px color-mix(in srgb,var(--marca) 45%,transparent)}
.marca h1{font-weight:600;font-size:20px}
.marca p{letter-spacing:.16em;font-size:10.5px}
.periodo{border-radius:999px;background:var(--superficie)}
.periodo select{font-family:var(--fonte-display);font-weight:500;font-size:15px}
.estado{border-radius:999px;background:transparent}
.estado .ponto{background:var(--marca);box-shadow:0 0 0 3px color-mix(in srgb,var(--marca) 22%,transparent)}
.abas button{font-weight:600;color:var(--tinta-3);transition:color .2s}
.abas button[aria-selected="true"]{color:var(--marca-tinta);border-bottom-color:var(--marca)}

/* cartões */
.cartao,.kpi{border-color:var(--linha);background:linear-gradient(180deg,color-mix(in srgb,var(--superficie) 100%,#fff 2%),var(--superficie))}
.cartao > h2{font-size:17px;font-weight:600}
.kpi::after{display:none}
.kpi .rot{font-size:10.5px;letter-spacing:.16em}
.kpi .val{font-family:var(--fonte-num);font-weight:500;letter-spacing:-.02em;font-size:clamp(20px,5vw,27px)}
@media(min-width:700px){ .kpi .val{font-size:27px} }
.kpi[data-t="bom"] .val{color:var(--bom)}

/* o número principal: "sobrou" vira a nota */
.kpis:has(> [data-heroi]){display:flex;flex-wrap:wrap}
.kpis:has(> [data-heroi]) > .kpi{flex:1 1 150px;min-width:0}
.kpi[data-heroi]{
  flex-basis:100%!important;order:-1;padding:22px 22px 20px;
  border-color:color-mix(in srgb,var(--marca) 38%,var(--linha));
  background:var(--superficie);isolation:isolate;
}
.kpi[data-heroi]::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    repeating-radial-gradient(circle at 108% 130%, transparent 0 11px, rgba(216,180,90,.10) 11px 12px),
    repeating-radial-gradient(circle at -12% -40%, transparent 0 15px, rgba(216,180,90,.06) 15px 16px);
  -webkit-mask-image:linear-gradient(100deg,transparent 18%,#000 70%);
          mask-image:linear-gradient(100deg,transparent 18%,#000 70%);
}
.kpi[data-heroi] .rot{font-family:var(--fonte-display);font-style:italic;text-transform:none;letter-spacing:0;font-size:15px;font-weight:400;color:var(--tinta-2)}
.kpi[data-heroi] .val{font-size:clamp(42px,12vw,68px);line-height:1;margin-top:8px;color:#F6EDD2;font-variation-settings:"opsz" 144,"SOFT" 50}
.kpi[data-heroi][data-t="grave"] .val{color:var(--grave)}
.kpi[data-heroi] .pe{font-size:13px;margin-top:8px}
.kpi[data-heroi] .pe::before{content:"";display:inline-block;width:22px;height:1px;background:var(--marca);vertical-align:middle;margin-right:8px;opacity:.8}

/* barras e colunas */
.trilho{background:color-mix(in srgb,var(--papel) 70%,transparent);border-color:transparent;height:8px}
.col i{background:color-mix(in srgb,var(--tinta-3) 55%,var(--superficie-2));opacity:1}
.col[data-hoje] i{background:var(--marca)}

/* listas */
.item{border-radius:12px}
.item .pastilha{width:6px;border-radius:99px}
.item .valor,.fx .valor{font-size:15px}
.dia-rot{letter-spacing:.14em;font-size:11px}

textarea.extrato{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;font-size:12.5px}

/* app na tela inicial do iPhone: nada embaixo do relógio nem da barrinha de baixo */
.topo{padding-top:calc(14px + env(safe-area-inset-top))}
.fab{bottom:calc(20px + env(safe-area-inset-bottom))}
#torrada{bottom:calc(24px + env(safe-area-inset-bottom))}
.veu{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.pronto-app{text-align:center}
.pronto-app .selo{margin:4px auto 14px;width:56px;height:56px;font-size:26px}

/* limites */
.meta-linha{grid-template-columns:minmax(0,1fr) auto}
.meta-linha .cat-topo{flex-wrap:wrap;gap:2px 10px}
.meta-in{border-radius:999px;padding:6px 14px}
.meta-in input{width:64px}

/* fixas */
.mes h3{font-size:16px;font-weight:600}
.selo-sit{border-radius:999px;font-weight:600;letter-spacing:.04em}
.selo-sit[data-s="pago"]{background:transparent;color:var(--marca);border:1.5px solid var(--marca);text-transform:uppercase;font-size:10px;letter-spacing:.14em;padding:1px 8px;display:inline-block;transform:rotate(-4deg)}
.selo-sit[data-s="a-pagar"]{background:var(--superficie-2);color:var(--tinta-2)}

/* botões */
.btn{border-radius:999px;transition:background .15s,border-color .15s,transform .12s var(--mola)}
.btn:active,.icone:active,.chip:active,.filtro:active,.abas button:active,.periodo button:active{transform:scale(.95)}
.btn-forte{background:var(--marca);border-color:var(--marca);color:var(--sobre-marca)}
.btn-forte:hover{background:var(--marca-tinta);border-color:var(--marca-tinta)}
.fab{border-radius:50%;background:var(--marca);color:var(--sobre-marca);box-shadow:0 10px 28px -8px rgba(216,180,90,.55),inset 0 0 0 4px rgba(19,38,27,.12);transition:transform .15s var(--mola),background .15s}
.fab:hover{background:var(--marca-tinta);transform:rotate(90deg)}
.fab:active{transform:scale(.9) rotate(90deg)}
.filtro[aria-pressed="true"]{color:var(--sobre-marca)}
.insight:is([data-n="alto"],[data-n="medio"],[data-n="bom"]) .chip,.rev-cab[data-p] .tag{color:var(--sobre-marca)}
.sim-total{background:var(--marca-suave);border-color:color-mix(in srgb,var(--marca) 35%,transparent)}
.sim-total .g{font-family:var(--fonte-num);font-weight:500}

/* campos */
.campo input,.campo select,.rapido input,textarea.extrato,.meta-in,.rev-cat select{background:color-mix(in srgb,var(--papel) 60%,var(--superficie))}
.rapido input{border-radius:999px;padding:11px 16px;transition:border-color .2s,box-shadow .2s}
.rapido input:focus{border-color:var(--marca);box-shadow:0 0 0 4px color-mix(in srgb,var(--marca) 16%,transparent)}
.chip{border-radius:999px}

/* janelas */
.veu{background:rgba(4,14,9,.62);backdrop-filter:blur(4px);animation:aparece .22s ease both}
.folha{border-color:color-mix(in srgb,var(--marca) 25%,var(--linha));animation:sobe-folha .38s var(--mola) both}
@media(min-width:640px){.folha{animation-name:abre-folha}}
.folha h2{font-size:21px;font-weight:600}
.entrar{background:rgba(4,14,9,.66)}
#torrada{background:var(--tinta);color:var(--sobre-marca);border-radius:16px;font-weight:500;transition:transform .45s var(--mola)}

/* ======================= movimento ======================= */
@keyframes aparece{from{opacity:0}}
@keyframes sobe-folha{from{transform:translateY(40px);opacity:.4}}
@keyframes abre-folha{from{transform:translateY(12px) scale(.96);opacity:0}}
@keyframes entra{from{opacity:0;transform:translateY(12px)}}
@keyframes enche{from{width:0}}
@keyframes cresce{from{transform:scaleY(0)}}
@keyframes carimbo{
  0%{transform:scale(2.4) rotate(-16deg);opacity:0}
  55%{transform:scale(.9) rotate(-3deg);opacity:1}
  75%{transform:scale(1.06) rotate(-5deg)}
  100%{transform:scale(1) rotate(-4deg)}
}
@keyframes brilho{from{background:color-mix(in srgb,var(--marca) 16%,transparent)}}
@keyframes pulso{
  0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--marca) 55%,transparent);border-color:var(--marca)}
  100%{box-shadow:0 0 0 14px transparent}
}

#conteudo.anima .kpis > *,
#conteudo.anima .lista > *,
#conteudo.anima .meses > *,
#conteudo.anima .insights > *,
#conteudo.anima .cats > *,
#conteudo.anima > *{animation:entra .55s var(--mola) both;animation-delay:calc(var(--i,0) * 45ms)}
#conteudo.anima .barra{animation:enche .9s var(--mola) both;animation-delay:calc(var(--i,0) * 45ms + 160ms)}
#conteudo.anima .col i{transform-origin:bottom;animation:cresce .7s var(--mola) both;animation-delay:calc(var(--k,0) * 16ms + 120ms)}
.selo-sit.carimbo{animation:carimbo .55s var(--mola) both}
.fx.acabou-de-pagar{animation:brilho 1.4s ease-out both;border-radius:10px}
.rapido.salvo input{animation:pulso .7s ease-out}

/* ======================= CELULAR: feito para o dedo ======================= */
/* abas com ícone: no computador só o texto; no celular viram a barra de baixo */
.abas svg,.abas .rot-c{display:none}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,a,input,select,textarea,label{touch-action:manipulation}

/* aviso escondido nunca aparece pela metade */
#torrada:not(.vem){opacity:0;pointer-events:none}
#torrada{transition:transform .45s var(--mola),opacity .25s}

/* iPhone dá zoom sozinho em campo com letra menor que 16px */
@media (max-width:719px),(pointer:coarse){
  input,select,textarea{font-size:16px!important}
}

@media (hover:none){
  .fab:hover{transform:none;background:var(--marca)}
  .btn:hover{background:var(--superficie)}
  .btn-forte:hover{background:var(--marca);border-color:var(--marca)}
  .item:hover{background:none}
  .icone:hover{background:none;color:var(--tinta-3)}
}

@media (max-width:719px){
  /* topo solto: rola junto com a página em vez de ocupar a tela */
  .topo{position:static;backdrop-filter:none;-webkit-backdrop-filter:none;background:transparent;border-bottom:0;padding-bottom:2px}
  .topo-linha{gap:10px}
  .marca p{display:none} /* a contagem já aparece no seletor do mês */
  .marca h1{font-size:22px}
  .periodo{order:3;width:100%;justify-content:space-between}
  .periodo select{flex:1;text-align:center;text-align-last:center}
  .periodo button{min-width:46px;min-height:44px;font-size:20px}
  .estado{min-height:36px}
  .rapido input{padding:12px 16px}

  /* barra de abas embaixo, ao alcance do polegar */
  .abas{
    position:fixed;left:0;right:0;bottom:0;z-index:45;margin:0;overflow:visible;
    display:grid;grid-template-columns:repeat(6,1fr);gap:2px;
    padding:6px max(6px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
    background:color-mix(in srgb,var(--papel) 90%,transparent);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid color-mix(in srgb,var(--marca) 22%,var(--linha));
  }
  .abas button{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    min-height:52px;padding:5px 0 4px;border:0;border-radius:14px;
    font-size:10.5px;font-weight:600;letter-spacing:-.01em;color:var(--tinta-3);
  }
  .abas button svg{display:block;width:23px;height:23px}
  .abas button[aria-selected="true"]{color:var(--marca-tinta);background:color-mix(in srgb,var(--marca) 13%,transparent)}
  .abas .rot-l,.abas .cont{display:none}
  .abas .rot-c{display:block;white-space:nowrap}
  main{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
  .fab{bottom:calc(80px + env(safe-area-inset-bottom));right:16px}
  #torrada{bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(calc(100% + 160px))}

  /* janelas sobem de baixo, de ponta a ponta */
  .veu,.entrar{place-items:end stretch;padding:0}
  .folha{
    max-width:none;border-radius:24px 24px 0 0;border-bottom:0;
    max-height:calc(100dvh - 30px - env(safe-area-inset-top));
    padding:22px 20px calc(20px + env(safe-area-inset-bottom));
  }
  .folha-pe .btn{min-height:48px;font-size:15px}

  /* alvos do tamanho do dedo */
  .btn{min-height:42px}
  .icone{min-width:42px;min-height:42px}
  .acoes{gap:0}
  .item{gap:8px}
  .item-txt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fx .btn{min-height:38px;padding:8px 14px;font-size:13px}
  .chip{min-height:34px}
}

/* ======================= SOBROU: cara de app de banco ======================= */
:root{
  --fonte-marca:"Fraunces",ui-serif,Georgia,serif;
  --fonte-display:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --fonte-num:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mola-forte:cubic-bezier(.3,1.3,.5,1);
}
body{font-variant-numeric:tabular-nums}
.app{max-width:560px;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
.topo{position:static;background:transparent;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;margin:0!important;padding:calc(10px + env(safe-area-inset-top)) 0 4px!important}
.topo .topo-linha{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
#titulo{font-family:var(--fonte-display);font-size:24px;font-weight:700;letter-spacing:-.02em;margin-right:auto}
.topo .periodo{order:0;width:auto;gap:0;background:transparent;border:0}
.topo .periodo select{flex:none;background:transparent;border:0;font-weight:600;font-size:14px;color:var(--tinta-2);padding:6px 2px;width:auto;max-width:none;field-sizing:content;text-align:right;text-align-last:right}
.topo .periodo button{min-width:30px;min-height:40px;background:transparent;border:0;color:var(--tinta-3);font-size:20px}
.icone-topo{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--tinta-2);display:grid;place-items:center;cursor:pointer}
.topo .estado{background:transparent;border:0;padding:10px 6px;min-height:0}
.topo .estado span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cartao{background:var(--superficie);border:1px solid var(--linha);border-radius:18px;box-shadow:none}

/* Início */
.heroi{padding:14px 2px 6px}
.heroi-rot{font-size:13px;color:var(--tinta-3);font-weight:500}
.heroi-val{display:inline-block;font-size:clamp(34px,10vw,44px);font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:2px 0 6px}
.heroi-comp{font-size:13px;font-weight:600;margin:0 0 4px}
.heroi-comp[data-s="menos"]{color:var(--bom)}
.heroi-comp[data-s="mais"]{color:var(--grave)}
.heroi-comp[data-s="igual"]{color:var(--tinta-3)}
.heroi-comp[data-s="menos"]::before{content:"↓ "}
.heroi-comp[data-s="mais"]::before{content:"↑ "}
.heroi-pe{font-size:13px;color:var(--tinta-3)}
.bloco{margin-top:22px}
.bloco h2{font-size:16px;font-weight:700;margin:0 0 4px}
.faixa{display:flex;gap:3px;height:16px;border-radius:8px;overflow:hidden}
.faixa-pd{flex:var(--p) 1 0;min-width:6px;background:var(--c);border:0;padding:0;cursor:pointer}
.pilulas{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pilula{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linha);background:var(--superficie);color:var(--tinta-2);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:500;cursor:pointer}
.pilula i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.linhas{display:flex;flex-direction:column}
.linha{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--linha);padding:12px 2px;text-align:left;cursor:pointer;color:inherit}
.linha:last-child{border-bottom:0}
.linha-txt,.lin-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.linha-txt b,.lin-txt b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha-txt small,.lin-txt small{color:var(--tinta-3);font-size:12.5px}
.linha-val{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.linha-val b{font-weight:700}
.linha-val small{font-size:12px;font-weight:600}
.linha-val small[data-s="mais"]{color:var(--grave)}
.linha-val small[data-s="menos"]{color:var(--bom)}
.linha-val small[data-s="igual"]{color:var(--tinta-3)}
.ic-cat{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.aviso-fixas{display:flex;align-items:center;gap:10px;width:100%;margin-top:18px;padding:12px 14px;border-radius:14px;border:0;cursor:pointer;text-align:left;font-weight:600;font-size:14px;background:var(--alerta-suave);color:var(--alerta)}
.aviso-fixas[data-t="grave"]{background:var(--grave-suave);color:var(--grave)}
.aviso-fixas span{flex:1}
.convite{text-align:center;padding:48px 12px}
.convite h2{font-size:20px;font-weight:700;margin-bottom:6px}
.convite p{color:var(--tinta-3);margin:0 0 18px}
.nada{color:var(--tinta-3);text-align:center;padding:24px 0}

/* folhas */
.alca{width:38px;height:5px;border-radius:3px;background:var(--linha-forte);margin:-6px auto 12px}
.alca,[data-puxa]{touch-action:none}
.det-topo{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.det-topo h2{flex:1;margin:0!important}
.det-total{display:inline-block;font-size:32px;font-weight:700;letter-spacing:-.03em}
.semanas{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;height:120px;align-items:end;margin:18px 0 8px}
.sem{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;background:none;border:0;padding:0;cursor:pointer;color:var(--tinta-3);font-size:11.5px}
.sem i{display:block;height:max(4px,calc(var(--h) * .8));border-radius:6px 6px 2px 2px;background:var(--marca);opacity:.8;transform-origin:bottom}
.sem:focus i,.sem:active i{opacity:1}
.sem:focus::before{content:attr(data-v);position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--tinta);color:var(--sobre-marca);font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:8px;white-space:nowrap}
.det-item{display:flex;justify-content:space-between;gap:12px;width:100%;padding:11px 2px;background:none;border:0;border-bottom:1px solid var(--linha);color:inherit;font-size:14px;cursor:pointer;text-align:left}
.dica{display:flex;gap:8px;align-items:flex-start;margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--marca-suave);color:var(--marca-tinta);font-size:13.5px}
.folha-lancar .rapido{display:flex;gap:8px;margin:0}
.folha-lancar .rapido input{flex:1;min-width:0;font-size:17px!important}
#rapido-ok{min-width:92px;border-radius:999px}
.folha-lancar .rapido-previa{min-height:30px;margin-top:10px}
.folha-lancar > .btn-txt{margin-top:6px}

/* Extrato */
.busca{display:flex;align-items:center;gap:8px;background:var(--superficie);border:1px solid var(--linha);border-radius:12px;padding:0 12px;color:var(--tinta-3);margin-top:6px}
.busca input{flex:1;min-width:0;border:0;background:transparent;padding:11px 0;outline:0;color:var(--tinta)}
.chips-f{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips-f::-webkit-scrollbar{display:none}
.chip-f{flex:none;border:1px solid var(--linha-forte);background:transparent;color:var(--tinta-2);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;cursor:pointer}
.chip-f[aria-pressed="true"]{background:var(--tinta);color:var(--sobre-marca);border-color:var(--tinta)}
.dia{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--tinta-3);padding:16px 2px 4px}
.lin{position:relative;overflow:hidden;border-bottom:1px solid var(--linha)}
.lin-acoes{position:absolute;top:0;right:0;bottom:0;display:flex}
.lin-acoes button{width:56px;border:0;display:grid;place-items:center;cursor:pointer}
.lin-ed{background:var(--superficie-2);color:var(--tinta)}
.lin-ap{background:var(--grave);color:var(--sobre-marca)}
.lin-frente{position:relative;z-index:1;display:flex;align-items:center;gap:12px;width:100%;padding:11px 2px;background:var(--papel);border:0;color:inherit;text-align:left;cursor:pointer;touch-action:pan-y;transition:transform .3s var(--mola-forte)}
.lin-val{font-weight:600;white-space:nowrap}
.lin-val.mais{color:var(--bom)}
@media (hover:hover){.lin:hover .lin-frente{transform:translateX(-112px)}}

/* Mais */
.menu{display:flex;flex-direction:column;margin-top:6px}
.menu-it{display:flex;align-items:center;gap:14px;width:100%;padding:14px 2px;background:none;border:0;border-bottom:1px solid var(--linha);color:inherit;text-align:left;cursor:pointer}
.menu-it.estatico{cursor:default}
.menu-ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--superficie-2);color:var(--marca-tinta)}
.menu-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.menu-txt b{font-weight:600}
.menu-txt small{color:var(--tinta-3);font-size:12.5px}
.voltar{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--marca-tinta);font-weight:600;padding:8px 0;margin-bottom:4px;cursor:pointer}

/* barra de baixo */
.barra-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--papel) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--linha)}
.barra-it{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--tinta-3);font-size:11px;font-weight:600;padding:6px 0;cursor:pointer}
.barra-it[aria-current]{color:var(--marca-tinta)}
.barra-mais{justify-self:center;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;border:0;background:var(--marca);color:var(--sobre-marca);cursor:pointer;box-shadow:0 8px 20px -8px rgba(0,0,0,.6)}
.barra-mais span{display:none}
.barra-ind{position:absolute;top:6px;left:8px;width:calc((100% - 16px) / 5);height:52px;pointer-events:none;transform:translateX(calc(var(--i,0) * 100%));transition:transform .45s var(--mola-forte)}
.barra-ind::before{content:"";position:absolute;inset:0 14%;border-radius:14px;background:color-mix(in srgb,var(--marca) 14%,transparent)}
.barra-marca{display:none}

/* aviso em pílula no topo */
#torrada{top:calc(10px + env(safe-area-inset-top));bottom:auto!important;left:50%;transform:translateX(-50%) scale(.6);opacity:0;display:flex;align-items:center;gap:12px;
  border-radius:999px;padding:10px 16px;background:var(--tinta);color:var(--sobre-marca);font-weight:600;font-size:13.5px;
  transition:transform .45s var(--mola-forte),opacity .2s;max-width:calc(100vw - 24px)}
#torrada.vem{transform:translateX(-50%) scale(1);opacity:1}
.torrada-desf{background:none;border:0;color:inherit;font:inherit;text-decoration:underline;opacity:.75;cursor:pointer;padding:0}

/* esconder valores */
body.ocultar .din{color:transparent!important;position:relative;white-space:nowrap}
body.ocultar .din::after{content:"R$ •••";position:absolute;left:0;top:0;color:var(--tinta-2)}
body.ocultar .heroi-val.din::after,body.ocultar .det-total.din::after{color:var(--tinta)}
body.ocultar .sem:focus::before{content:"R$ •••"}
/* ======================= SOBROU: movimento ======================= */
#rapido-ok{transition:min-width .35s var(--mola-forte),width .35s var(--mola-forte),background .2s}
#rapido-ok.carregando{color:transparent;position:relative}
#rapido-ok.carregando::after{content:"";position:absolute;inset:0;margin:auto;width:18px;height:18px;border-radius:50%;border:2px solid color-mix(in srgb,var(--sobre-marca) 30%,transparent);border-top-color:var(--sobre-marca);animation:gira .6s linear infinite}
#rapido-ok.ok{min-width:44px;width:44px;padding:0;display:grid;place-items:center;background:var(--bom);border-color:var(--bom);color:var(--sobre-marca)}
@keyframes gira{to{transform:rotate(360deg)}}
.folha-detalhe .sem i{animation:cresce .45s var(--mola-forte) both;animation-delay:calc(var(--k,0) * 60ms + 120ms)}
.lin.nova{animation:entra-lin .45s var(--mola-forte) both}
@keyframes entra-lin{from{opacity:0;transform:translateY(-10px)}}
.din{transition:filter .16s ease}
body.desfocando .din{filter:blur(6px)}
::view-transition-group(ic-detalhe){animation-duration:.4s;animation-timing-function:var(--mola-forte)}
.oculto{display:none!important}
</style>
</head>
<body>

<div class="app">
  <header class="topo">
    <div class="topo-linha">
      <h1 id="titulo">Olá</h1>
      <div class="periodo">
        <button type="button" data-acao="mes-ant" aria-label="Mês anterior">&#8249;</button>
        <select id="sel-periodo" aria-label="Período"></select>
        <button type="button" data-acao="mes-prox" aria-label="Próximo mês">&#8250;</button>
      </div>
      <button type="button" class="icone-topo" id="btn-olho" data-acao="olho" aria-pressed="false" aria-label="Esconder valores"></button>
      <button type="button" class="estado" id="estado" data-s="ok"><i class="ponto"></i><span>Salvo</span></button>
    </div>
  </header>
  <main id="conteudo"></main>
</div>

<nav class="barra-nav" id="barra" aria-label="Navegação"></nav>

<div id="lancar" class="veu oculto" data-acao="fechar-lancar">
  <div class="folha folha-lancar" role="dialog" aria-modal="true" aria-labelledby="lancar-tit">
    <div class="alca" aria-hidden="true"></div>
    <h2 id="lancar-tit" data-puxa>Lançar</h2>
    <form class="rapido" id="rapido" autocomplete="off">
      <input id="rapido-txt" type="text" enterkeyhint="done" placeholder="ifood 35 · uber 15 ontem · +salário 3000" aria-label="Lançar rápido" aria-describedby="rapido-previa">
      <button type="submit" class="btn btn-forte" id="rapido-ok">Lançar</button>
    </form>
    <div class="rapido-previa" id="rapido-previa" aria-live="polite"></div>
    <button type="button" class="btn btn-txt" data-acao="novo">Formulário completo</button>
  </div>
</div>

<div id="entrar" class="entrar oculto" role="dialog" aria-modal="true" aria-labelledby="entrar-tit">
  <form class="folha" id="form-entrar" novalidate>
    <h2 id="entrar-tit">Entrar no painel</h2>
    <p class="sub" style="margin:0 0 12px">Seus lançamentos ficam salvos na nuvem e aparecem no celular e no computador. Você recebe um link no e-mail; é só uma vez por aparelho.</p>
    <div class="campo">
      <label for="e-email">Seu e-mail</label>
      <input id="e-email" type="email" autocomplete="email" inputmode="email" required>
    </div>
    <p class="sub" id="entrar-msg" role="status" style="margin:8px 0 0"></p>
    <div class="folha-pe">
      <button type="button" class="btn" id="e-depois">Agora não</button>
      <button type="submit" class="btn btn-forte" id="e-ok">Mandar link</button>
    </div>
  </form>
</div>
<div id="modal"></div>
<div id="torrada" role="status" aria-live="polite"></div>

<script type="module" src="/js/painel.js"></script>

</body>
</html>
